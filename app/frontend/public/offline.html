<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>需要网络连接 · T24 OS</title>
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: #f3f6fb;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 420px); text-align: center; }
      .mark {
        display: grid;
        width: 72px;
        height: 72px;
        margin: 0 auto;
        place-items: center;
        border-radius: 22px;
        background: #2563eb;
        color: white;
        font-weight: 850;
        letter-spacing: .04em;
        box-shadow: 0 18px 40px -22px rgba(37, 99, 235, .85);
      }
      h1 { margin: 24px 0 0; font-size: 22px; }
      p { margin: 12px 0 0; color: #64748b; font-size: 14px; line-height: 1.7; }
      a {
        display: flex;
        min-height: 48px;
        margin-top: 24px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      small { display: block; margin-top: 16px; color: #94a3b8; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">T24</div>
      <h1>需要网络连接</h1>
      <p>为保护客户、财务和员工资料，T24 OS 不会离线保存业务页面。请连接网络后重新进入系统。</p>
      <a href="/apps">网络恢复后重新加载</a>
      <small>离线状态不会提交或修改任何业务数据。</small>
    </main>
  </body>
</html>
