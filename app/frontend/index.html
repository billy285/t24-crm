<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/t2-favicon-64.png?v=t2-20260822-official" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/t2-apple-touch-icon-180.png?v=t2-20260822-official" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06243f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="T24 OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="format-detection" content="telephone=no" />
    <title>T24 Marketing 客户管理系统</title>
    <meta name="description" content="T24 Marketing CRM - 适合美国华人餐厅/实体商家的客户管理系统" />
    <meta name="author" content="T24 Marketing" />

    <meta property="og:title" content="T24 Marketing 客户管理系统" />
    <meta property="og:description" content="T24 Marketing CRM - 客户跟进、成交、交付、续费、收款一站式管理" />
    <meta property="og:type" content="website" />
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
      }
      #t24-bootstrap {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f8fb;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      #t24-bootstrap-card {
        box-sizing: border-box;
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 24px 60px -36px rgba(15, 23, 42, 0.42);
      }
      #t24-bootstrap-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: #2563eb;
        box-shadow: 0 18px 35px -18px rgba(37, 99, 235, 0.72);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      #t24-bootstrap-title {
        margin: 18px 0 0;
        color: #475569;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #t24-bootstrap-heading {
        margin: 8px 0 0;
        font-size: 22px;
        font-weight: 700;
      }
      #t24-bootstrap-progress {
        height: 6px;
        margin: 24px 0 0;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      #t24-bootstrap-progress > span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #38bdf8);
        animation: t24-bootstrap-progress 1.4s ease-in-out infinite;
      }
      #t24-bootstrap-message {
        margin: 16px 0 0;
        color: #334155;
        font-size: 14px;
        font-weight: 600;
      }
      #t24-bootstrap-reassurance {
        margin: 12px 0 0;
        padding: 12px 14px;
        border-radius: 14px;
        background: #eff6ff;
        color: #475569;
        font-size: 13px;
        line-height: 1.65;
      }
      #t24-bootstrap-slow {
        margin: 14px 0 0;
        color: #92400e;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0;
        animation: t24-bootstrap-reveal 0.25s ease 6s forwards;
      }
      #t24-bootstrap-retry {
        display: inline-flex;
        margin-top: 12px;
        padding: 9px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        opacity: 0;
        pointer-events: none;
        animation: t24-bootstrap-enable-retry 0.25s ease 12s forwards;
      }
      @keyframes t24-bootstrap-progress {
        0% { transform: translateX(-125%); }
        100% { transform: translateX(340%); }
      }
      @keyframes t24-bootstrap-reveal {
        to { opacity: 1; }
      }
      @keyframes t24-bootstrap-enable-retry {
        to { opacity: 1; pointer-events: auto; }
      }
      @media (prefers-reduced-motion: reduce) {
        #t24-bootstrap-progress > span { animation-duration: 3s; }
      }
      @media (max-width: 520px) {
        #t24-bootstrap { padding: 16px; }
        #t24-bootstrap-card { padding: 28px 20px; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="t24-bootstrap" role="status" aria-live="polite" aria-busy="true">
        <div id="t24-bootstrap-card">
          <div id="t24-bootstrap-mark" aria-hidden="true">T24</div>
          <p id="t24-bootstrap-title">T24 Marketing 客户管理系统</p>
          <h1 id="t24-bootstrap-heading">正在打开工作台</h1>
          <div id="t24-bootstrap-progress" aria-hidden="true"><span></span></div>
          <p id="t24-bootstrap-message">正在验证登录状态和访问权限，请稍候…</p>
          <p id="t24-bootstrap-reassurance">资料完整返回后会自动显示；加载期间不会用空白或“0 条”代替真实数据。</p>
          <p id="t24-bootstrap-slow">连接时间比平时稍长。请保持页面打开，等待不会造成客户资料丢失。</p>
          <a id="t24-bootstrap-retry" href="">重新连接</a>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
