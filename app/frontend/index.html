<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=t2-20260709b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="T24 OS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="format-detection" content="telephone=no" />
    <title>T24 Marketing 客户管理系统</title>
    <meta name="description" content="T24 Marketing CRM - 适合美国华人餐厅/实体商家的客户管理系统" />
    <meta name="author" content="T24 Marketing" />

    <meta property="og:title" content="T24 Marketing 客户管理系统" />
    <meta property="og:description" content="T24 Marketing CRM - 客户跟进、成交、交付、续费、收款一站式管理" />
    <meta property="og:type" content="website" />
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
      }
      #t24-bootstrap {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f8fb;
        color: #0f172a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      #t24-bootstrap-mark {
        width: 64px;
        height: 64px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 20px;
        background: #2563eb;
        box-shadow: 0 18px 35px -18px rgba(37, 99, 235, 0.72);
        color: #fff;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      #t24-bootstrap-title {
        margin: 18px 0 0;
        font-size: 18px;
        font-weight: 700;
      }
      #t24-bootstrap-spinner {
        width: 26px;
        height: 26px;
        margin: 18px auto 0;
        border: 3px solid #dbeafe;
        border-bottom-color: #2563eb;
        border-radius: 999px;
        animation: t24-bootstrap-spin 0.8s linear infinite;
      }
      #t24-bootstrap-message {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 13px;
      }
      @keyframes t24-bootstrap-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #t24-bootstrap-spinner { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="t24-bootstrap" role="status" aria-live="polite" aria-busy="true">
        <div>
          <div id="t24-bootstrap-mark" aria-hidden="true">T24</div>
          <p id="t24-bootstrap-title">T24 Marketing 客户管理系统</p>
          <div id="t24-bootstrap-spinner" aria-hidden="true"></div>
          <p id="t24-bootstrap-message">正在安全连接系统…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
